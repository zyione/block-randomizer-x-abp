plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

version = "${project.mod_version}+mc${project.minecraft_version}"
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}
jar { from('LICENSE') { rename { "${it}_${project.archives_base_name}" } } }

tasks.register('selectionTest', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'SelectionTest'
}
check.dependsOn selectionTest


// Mixin reserves its configured package and every subpackage. Main classes and
// helpers in that namespace cause IllegalClassLoadError at game startup.
tasks.register('verifyModPackaging') {
    dependsOn remapJar
    inputs.file(tasks.remapJar.archiveFile)
    doLast {
        def jarFile = tasks.remapJar.archiveFile.get().asFile
        def archive = new java.util.zip.ZipFile(jarFile)
        try {
            def parser = new groovy.json.JsonSlurper()
            def metadata = parser.parse(archive.getInputStream(archive.getEntry('fabric.mod.json')))
            metadata.mixins.each { spec ->
                def name = spec instanceof Map ? spec.config : spec
                def config = parser.parse(archive.getInputStream(archive.getEntry(name)))
                def prefix = config.package + '.'
                def directory = prefix.replace('.', '/')
                def declared = ((config.mixins ?: []) + (config.client ?: []) + (config.server ?: []))
                    .collect { directory + it.replace('.', '/') + '.class' } as Set
                declared.each { classFile ->
                    if (archive.getEntry(classFile) == null) throw new GradleException("Missing mixin: ${classFile}")
                }
                archive.entries().each { entry ->
                    if (entry.name.startsWith(directory) && entry.name.endsWith('.class') && !declared.contains(entry.name)) {
                        throw new GradleException("Non-mixin class in reserved package: ${entry.name}")
                    }
                }
                metadata.entrypoints.values().flatten().each { entry ->
                    def className = entry instanceof Map ? entry.value : entry
                    if (className.startsWith(prefix)) throw new GradleException("Entrypoint in reserved mixin package: ${className}")
                    if (archive.getEntry(className.replace('.', '/') + '.class') == null) {
                        throw new GradleException("Missing entrypoint: ${className}")
                    }
                }
                if (config.refmap && archive.getEntry(config.refmap) == null) throw new GradleException('Missing mixin refmap')
            }
            logger.lifecycle('PASS: mixin package contains only declared mixins; entrypoints are outside it; refmap is present')
        } finally { archive.close() }
    }
}
check.dependsOn verifyModPackaging
